apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
  labels: {app.kubernetes.io/name: api-candidate, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: api-candidate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-candidate, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            # The candidate reads its own collection; everything else is the live configuration.
            - {name: CHROMA_COLLECTION, value: CANDIDATE_COLLECTION}
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 80Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: traces, mountPath: /traces}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: traces
          persistentVolumeClaim: {claimName: traces-data}
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
  labels: {app.kubernetes.io/name: api-candidate, app.kubernetes.io/part-of: rahbar}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api-candidate}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
