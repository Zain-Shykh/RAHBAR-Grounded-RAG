# Builds the candidate collection with a full re-index (architecture-a3 8.1). Edit CHUNK_SIZE and CHUNK_OVERLAP
# (or use `make candidate CHUNK=300 OVERLAP=50`, which substitutes them) and apply. Same image, labels and
# limits as the indexer Job, so the NetworkPolicies and the lake volume apply unchanged; its registry is
# registry/rahbar_cand.json, separate from the live one.
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-candidate
  namespace: rahbar
  labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CHROMA_COLLECTION, value: rahbar_cand}
            - {name: INDEX_MODE, value: full}
            - {name: CHUNK_SIZE, value: "CANDIDATE_CHUNK_SIZE"}
            - {name: CHUNK_OVERLAP, value: "CANDIDATE_CHUNK_OVERLAP"}
          resources:
            requests: {cpu: 250m, memory: 416Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: corpus, mountPath: /corpus, readOnly: true}
            - {name: lake, mountPath: /lake}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: corpus
          persistentVolumeClaim: {claimName: corpus-data, readOnly: true}
        - name: lake
          persistentVolumeClaim: {claimName: lake-data}
        - {name: tmp, emptyDir: {}}
