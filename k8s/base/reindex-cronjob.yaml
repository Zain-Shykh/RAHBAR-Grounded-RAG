# Weekly re-index (R-K8S-CRON). jobTemplate.spec is a placeholder: kustomization.yaml
# replaces it with the indexer Job's spec, so image, env and limits are identical.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec: {}
