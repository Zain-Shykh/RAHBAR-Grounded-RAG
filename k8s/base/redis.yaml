apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
  namespace: rahbar
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: rahbar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rahbar
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 1
  # The volume is ReadWriteOnce: the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      enableServiceLinks: false  # Service env vars (CHROMA_PORT=tcp://...) break Chroma and shadow the ConfigMap
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis/redis-stack-server:7.4.0-v8
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          env:
            - { name: REDIS_ARGS, value: "--appendonly yes" }
          startupProbe:
            exec: { command: [redis-cli, ping] }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache-data
          persistentVolumeClaim:
            claimName: cache-data
        - name: tmp
          emptyDir: {}
