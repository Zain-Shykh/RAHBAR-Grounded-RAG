# One-shot indexer (R-K8S-JOB). The reindex CronJob gets a copy of this spec via a
# kustomize replacement (kustomization.yaml), so the two cannot drift (D-093).
# It never touches Redis. It needs Chroma and the Ollama host only.
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      enableServiceLinks: false  # Service env vars (CHROMA_PORT=tcp://...) shadow the ConfigMap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: corpus-data
            readOnly: true
        - name: tmp
          emptyDir: {}
