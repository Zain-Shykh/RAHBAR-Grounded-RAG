# secret.placeholder.yaml is deliberately NOT listed (I-13).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - api.yaml
  - ui.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - corpus-pvc.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
# The CronJob runs exactly the Job's spec (D-093).
replacements:
  - source:
      kind: Job
      name: indexer
      fieldPath: spec
    targets:
      - select:
          kind: CronJob
          name: reindex
        fieldPaths:
          - spec.jobTemplate.spec
