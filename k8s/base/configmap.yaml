apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar-config
    app.kubernetes.io/part-of: rahbar
data:
  EMBED_MODEL: "nomic-embed-text"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:3b"
  RETRIEVER: "chroma"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  TOP_K: "5"
  # RELEVANCE_FLOOR 0.70: midpoint of the highest out-of-scope score (0.658) and the lowest answerable score (0.746), phase 12.
  RELEVANCE_FLOOR: "0.70"
  # CACHE_THRESHOLD 0.96: lowest tested value (0.88, 0.92, 0.96) with zero false hits; worst near-miss scored 0.958, phase 11.
  CACHE_THRESHOLD: "0.96"
  CACHE_TTL_SECONDS: "86400"
  # TEMPERATURE 0.2: facts and JSON want a low value, not 0, so the one retry can differ from the first try.
  TEMPERATURE: "0.2"
  LLM_NUM_CTX: "8192"
  LLM_MAX_TOKENS: "512"
  LLM_TIMEOUT_SECONDS: "300"
  LLM_MAX_CONCURRENCY: "2"
  INDEX_REFRESH_SECONDS: "10"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  EMBED_BATCH_SIZE: "32"
  CORPUS_DIR: "/corpus"
  LOG_LEVEL: "INFO"
