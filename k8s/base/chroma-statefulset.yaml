# Chroma is a StatefulSet (one writer, stable identity, PVC that outlives the pod): architecture 4.10.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: chroma
    app.kubernetes.io/part-of: rahbar
spec:
  serviceName: chroma
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      enableServiceLinks: false  # Service env vars (CHROMA_PORT=tcp://...) break Chroma and shadow the ConfigMap
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: IS_PERSISTENT, value: "TRUE" }
            - { name: PERSIST_DIRECTORY, value: /data }
            - { name: ANONYMIZED_TELEMETRY, value: "FALSE" }
          startupProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: chroma-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
        labels:
          app.kubernetes.io/name: chroma
          app.kubernetes.io/part-of: rahbar
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
