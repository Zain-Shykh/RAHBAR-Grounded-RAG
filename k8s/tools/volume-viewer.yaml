# Throw-away pod that mounts one claim read-only so `kubectl exec` and `kubectl cp` can read it.
# `make lake-ls`, `make results-pull` and `make traces-pull` substitute NAME and CLAIM. Not in any kustomization.
apiVersion: v1
kind: Pod
metadata:
  name: NAME
  namespace: rahbar
  labels: {app.kubernetes.io/name: volume-viewer, app.kubernetes.io/part-of: rahbar}
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: viewer
      image: busybox:1.37.0
      command: ["sleep", "1800"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: data, mountPath: /data, readOnly: true}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: CLAIM, readOnly: true}
