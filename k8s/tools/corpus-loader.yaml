# Short-lived helper for `make corpus`: mounts corpus-data so `kubectl cp` can fill it.
# Not in any kustomization on purpose. busybox is pinned and has tar (D-094).
apiVersion: v1
kind: Pod
metadata:
  name: corpus-loader
  namespace: rahbar
  labels:
    app.kubernetes.io/name: corpus-loader
    app.kubernetes.io/part-of: rahbar
spec:
  serviceAccountName: indexer
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: corpus
          mountPath: /corpus
  volumes:
    - name: corpus
      persistentVolumeClaim:
        claimName: corpus-data
